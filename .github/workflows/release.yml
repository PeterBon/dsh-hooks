name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version input
        run: node -e "if (!/^\\d+\\.\\d+\\.\\d+$/.test(process.argv[1])) { console.error('版本必须是 semver，例如 0.2.0'); process.exit(1) }" "${{ github.event.inputs.version }}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - name: Bump version on a release branch
        run: |
          V="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$V"
          npm version "$V" --no-git-tag-version
          git add package.json
          git commit -m "chore(release): v$V"
          git push origin "release/v$V"

      # The Actions-issued token cannot create PRs unless the repository
      # enables "Allow GitHub Actions to create and approve pull requests",
      # so the push above is the last automated step: open the PR from a
      # human-authenticated client (the pushed branch is the head).
      - name: Print pull request URL
        run: |
          V="${{ github.event.inputs.version }}"
          echo "Release branch pushed: release/v$V"
          echo "Open the PR: https://github.com/PeterBon/dsh-hooks/pull/new/release/v$V"

name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # OIDC token for npm trusted publishing (--provenance); harmless when the
  # NPM_TOKEN fallback path is used instead.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token declared at both levels: the runner only injected the OIDC
    # env vars once the job-level grant was present.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No registry-url: setup-node would otherwise write an empty
      # //registry.npmjs.org/:_authToken line into the user .npmrc, which
      # blocks the OIDC (trusted publishing) path with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - name: Create GitHub release (when missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --generate-notes

      # Auth: trusted publishing (OIDC) when no NPM_TOKEN secret is set,
      # falling back to the token otherwise. --provenance requires the OIDC
      # path; plain token auth cannot produce provenance. npm 10 (bundled
      # with Node 22) has no automatic GitHub OIDC exchange, so exchange the
      # id token for a Sigstore token ourselves (npm docs pattern).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
            npm publish --access public
          else
            ID_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
              -H "User-Agent: actions/oidc-client" \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
            SIGSTORE_ID_TOKEN="$ID_TOKEN" npm publish --provenance --access public
          fi

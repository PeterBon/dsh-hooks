name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # OIDC token for npm trusted publishing (--provenance); harmless when the
  # NPM_TOKEN fallback path is used instead.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - name: Create GitHub release (when missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --generate-notes

      # Auth: trusted publishing (OIDC) when no NPM_TOKEN secret is set,
      # falling back to the token otherwise. --provenance requires the OIDC
      # path; plain token auth cannot produce provenance.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            npm publish --provenance --access public
          fi

name: Publish

# Tag conventions: `vX.Y.Z` publishes the core dsh-hooks package at the repo
# root; `dsh-hooks-ui@vX.Y.Z` publishes the dsh-hooks-ui panel
# package under packages/.
on:
  push:
    tags: ['v*', 'dsh-hooks-ui@v*']

permissions:
  contents: write
  # OIDC token for npm trusted publishing (--provenance); harmless when the
  # NPM_TOKEN fallback path is used instead.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token declared at both levels: the runner only injected the OIDC
    # env vars once the job-level grant was present.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No registry-url: setup-node would otherwise write an empty
      # //registry.npmjs.org/:_authToken line into the user .npmrc, which
      # blocks the OIDC (trusted publishing) path with ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One gate for both packages: the root check covers the core package
      # and the workspace's UI package tests.
      - run: pnpm run check

      # Node 22 bundles npm 10, which has no automatic GitHub OIDC exchange
      # for registry auth (npm 11 feature). Upgrade npm so the tokenless
      # trusted-publishing path works.
      - run: npm install -g npm@11

      - name: Create GitHub release (when missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --generate-notes

      # Auth: trusted publishing (OIDC) when no NPM_TOKEN secret is set,
      # falling back to the token otherwise. --provenance requires the OIDC
      # path; plain token auth cannot produce provenance. Skipped when the
      # version already exists on npm so the flow is re-runnable.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == dsh-hooks-ui@* ]]; then
            PKG_DIR="packages/dsh-hooks-ui"
            PKG_NAME="dsh-hooks-ui"
          else
            PKG_DIR="."
            PKG_NAME="dsh-hooks"
          fi
          cd "$PKG_DIR"
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION already on npm — skipping publish"
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
            npm publish --access public
          else
            npm publish --provenance --access public
          fi

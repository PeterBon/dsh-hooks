name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version comes from the packageManager field — one source of truth
        # for local and CI installs.

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dependency security gate: fail on high/critical advisories. CI runs
      # against the official registry regardless of local mirror config.
      - run: pnpm audit --audit-level=high

      - run: pnpm run typecheck

      - run: pnpm run typecheck:test

      - run: pnpm test

      - run: pnpm run build

      # The Web GUI panel package (workspace member) keeps its own check
      # chain: typecheck + tests + tsdown build.
      - run: pnpm --filter @PeterBon/dsh-hooks-ui run check

      # lib/ is committed for git-hosted installs (they never build). Fail
      # when the committed copy drifts from a clean build — both the core
      # package at the repo root and the UI package under packages/.
      - name: Verify committed lib/ matches the build
        shell: bash
        run: |
          if ! git diff --exit-code -- lib packages/dsh-hooks-ui/lib; then
            echo "::error::lib/ is out of sync — run 'pnpm run build' and commit the result"
            exit 1
          fi

# Workspace layout: the dsh-hooks core package stays at the repository root
# (git installs like `github:PeterBon/dsh-hooks` resolve the root
# package.json), while optional add-on packages — the Web GUI panel — live
# under packages/.
packages:
  - '.'
  - 'packages/*'

allowBuilds:
  esbuild: true
  protobufjs: true

# GHSA-93q8-gq69-wqmw: ansi-regex <5.0.1 ReDoS (via qrcode -> yargs -> strip-ansi).
# Force the patched version until the qrcode/yargs chain is upgraded upstream.
overrides:
  ansi-regex: ^5.0.1

# Single-package repo: dsh-hooks is one dual-face plugin (host half +
# browser half), so the workspace is just the root package itself.
packages:
  - '.'

allowBuilds:
  esbuild: true
  protobufjs: true

# GHSA-93q8-gq69-wqmw: ansi-regex <5.0.1 ReDoS (via qrcode -> yargs -> strip-ansi).
# Force the patched version until the qrcode/yargs chain is upgraded upstream.
# GHSA-2883-xcg3-v3hh: js-yaml >=4.0.0 <4.3.2 unbounded CPU on empty merge keys
# (via @deepseek-ai/cordis -> cordis-plugin-include). Same treatment: pin the
# patched 4.x line until the cordis chain ships it.
# GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS (via @tsdown/css ->
# postcss). postcss's ^1.2.1 range already admits 1.2.2, but the lockfile kept
# the old resolution, so force the patched version like the two above.
# GHSA-587h-7wmj-h5pm: vite >=7.0.0 <=7.3.6 launch-editor fs.existsSync bypass on
# Windows (via vitest -> vite). vitest's peer range already admits 7.3.7, but the
# lockfile kept the old resolution, so force the patched version.
# GHSA-mrhx-c7xc-m3w5: zod <4.6.6 memory exhaustion while validating oversized
# constrained collections (via @deepseek-ai/dsh-session -> @deepseek-ai/dsh-llm).
# dsh-llm's ^4.4.3 range already admits 4.6.6, but the lockfile kept the old
# resolution, so force the patched version until the dsh chain ships a lockfile
# that resolves it.
overrides:
  ansi-regex: ^5.0.1
  js-yaml: ^4.3.2
  source-map-js: ^1.2.2
  vite: ^7.3.7
  zod: ^4.6.6

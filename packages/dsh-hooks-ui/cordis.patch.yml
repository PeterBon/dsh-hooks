# dsh-hooks-ui bundle patch: inserts the dual-face plugin row into the web
# profile roster. Install with
# `dsh plugin --profile web add dsh-hooks-ui`.
#
# The host half (exports ".") is a minimal no-op — the /dsh-hooks/* routes
# this panel consumes are registered by the dsh-hooks core plugin. The
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client") load in the web GUI, where it mounts the sidebar entry and the
# drawer dashboard.
- insert:
    - id: ui-dsh-hooks-panel
      name: 'dsh-hooks-ui'
